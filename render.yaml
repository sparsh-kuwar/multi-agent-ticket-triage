# Render Blueprint: one free web service.
# Runs in rule-based mode by default. To use the LLM agents, add OPENAI_API_KEY in the Render dashboard.
services:
  - type: web
    name: multi-agent-ticket-triage
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: tickets are kept in process memory, so every request must reach the same process.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SEED_SAMPLE_TICKETS
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
